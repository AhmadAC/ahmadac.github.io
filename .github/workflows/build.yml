name: Build Desktop Executables

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: MrCooperServer-Linux-AppImage
            artifact_path: dist/MrCooperServer-x86_64.AppImage
          - os: windows-latest
            artifact_name: MrCooperServer-Windows
            artifact_path: dist/MrCooperServer/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name "MrCooperServer" server.py
          # Copy web assets into the distribution directory
          cp -r index.html *.js *.css dist/MrCooperServer/ 2>/dev/null || true
          if [ -d "sounds" ]; then cp -r sounds dist/MrCooperServer/; fi
          if [ -d "0_Quiz" ]; then cp -r 0_Quiz dist/MrCooperServer/; fi
        shell: bash

      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/mrcooper

          # Copy PyInstaller binary distribution into AppDir
          cp -r dist/MrCooperServer/* AppDir/usr/bin/
          cp -r index.html *.js *.css AppDir/usr/share/mrcooper/ 2>/dev/null || true
          if [ -d "sounds" ]; then cp -r sounds AppDir/usr/share/mrcooper/; fi
          if [ -d "0_Quiz" ]; then cp -r 0_Quiz AppDir/usr/share/mrcooper/; fi

          # Create AppRun entrypoint script preserving host LD_LIBRARY_PATH
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export APPDIR="${HERE}"
          export OWD="$(pwd)"
          export LD_LIBRARY_PATH_ORIG="${LD_LIBRARY_PATH}"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/MrCooperServer" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create Desktop Entry
          cat << 'EOF' > AppDir/MrCooperServer.desktop
          [Desktop Entry]
          Type=Application
          Name=Mr. Cooper's Quiz Server
          Exec=MrCooperServer
          Icon=mrcooper
          Categories=Education;
          Terminal=false
          StartupNotify=true
          EOF

          # Create SVG Icon
          cat << 'EOF' > AppDir/mrcooper.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#008ee2"/>
            <text x="50" y="65" font-size="50" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold">Q</text>
          </svg>
          EOF
          cp AppDir/mrcooper.svg AppDir/usr/share/icons/hicolor/scalable/apps/mrcooper.svg
          cp AppDir/mrcooper.svg AppDir/.DirIcon

          # Download appimagetool and generate AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/MrCooperServer-x86_64.AppImage
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14